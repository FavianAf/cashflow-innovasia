<section class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h2 class="text-2xl md:text-3xl font-bold text-slate-950">Transaksi</h2>
      <p class="text-sm text-slate-500 mt-1">Daftar semua transaksi keuangan</p>
    </div>
    <button onclick="loadPage('tambah')" class="rounded-2xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-[0.98]">
      ➕ Tambah Transaksi
    </button>
  </div>

  <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-col sm:flex-row gap-3 mb-5">
      <div class="flex-1">
        <input type="text" id="tx-search" placeholder="Cari transaksi..." class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
      <select id="tx-type-filter" class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        <option value="">Semua Jenis</option>
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>
      <select id="tx-status-filter" class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        <option value="">Semua Status</option>
        <option value="Selesai">Selesai</option>
        <option value="Pending">Pending</option>
        <option value="Dibatalkan">Dibatalkan</option>
      </select>
    </div>

    <div class="overflow-x-auto rounded-3xl border border-slate-200">
      <table class="w-full">
        <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
          <tr>
            <th class="px-4 py-3 text-left">Tanggal</th>
            <th class="px-4 py-3 text-left">Kategori</th>
            <th class="px-4 py-3 text-left">Deskripsi</th>
            <th class="px-4 py-3 text-left">Jenis</th>
            <th class="px-4 py-3 text-left">Nominal</th>
            <th class="px-4 py-3 text-left">Status</th>
            <th class="px-4 py-3 text-left">Aksi</th>
          </tr>
        </thead>
        <tbody id="tx-tbody"></tbody>
      </table>
    </div>
  </div>
</section>
