<section class="space-y-6">
  <div>
    <h2 class="text-2xl md:text-3xl font-bold text-slate-950">Laporan</h2>
    <p class="text-sm text-slate-500 mt-1">Analisis cashflow berdasarkan periode</p>
  </div>

  <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="flex-1">
        <label class="mb-2 block text-sm font-semibold text-slate-700">Tanggal Awal</label>
        <input type="date" id="report-start" value="2026-05-29" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
      <div class="flex-1">
        <label class="mb-2 block text-sm font-semibold text-slate-700">Tanggal Akhir</label>
        <input type="date" id="report-end" value="2026-06-04" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
    </div>
  </div>

  <div id="report-summary"></div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
    <div class="lg:col-span-2">
      <div class="rounded-3xl border border-slate-200 bg-white p-5 md:p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-slate-900">Tabel Laporan</h3>
          <div class="flex gap-2">
            <button id="btn-export-pdf" class="rounded-2xl bg-rose-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-rose-700 active:scale-[0.98]">
              📄 Export PDF
            </button>
            <button id="btn-export-excel" class="rounded-2xl bg-emerald-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-emerald-700 active:scale-[0.98]">
              📊 Export Excel
            </button>
          </div>
        </div>
        <div class="overflow-x-auto rounded-3xl border border-slate-200">
          <table class="w-full">
            <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
              <tr>
                <th class="px-4 py-3 text-left">Tanggal</th>
                <th class="px-4 py-3 text-left">Kategori</th>
                <th class="px-4 py-3 text-left">Deskripsi</th>
                <th class="px-4 py-3 text-left">Jenis</th>
                <th class="px-4 py-3 text-left">Nominal</th>
              </tr>
            </thead>
            <tbody id="report-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div>
      <div class="rounded-3xl border border-slate-200 bg-white p-5 md:p-6 shadow-sm">
        <h3 class="text-lg font-semibold text-slate-900 mb-4">Ringkasan per Kategori</h3>
        <div id="report-category-summary"></div>
      </div>
    </div>
  </div>
