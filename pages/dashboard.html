<section class="space-y-6">
  <div class="rounded-3xl border border-blue-100 bg-gradient-to-br from-blue-600 to-indigo-600 p-6 md:p-8 text-white shadow-soft">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <p class="text-blue-200 text-sm font-medium">Selamat datang kembali 👋</p>
        <h2 class="text-2xl md:text-3xl font-bold mt-1">Cashflow Harian</h2>
        <p class="text-blue-200 text-sm mt-2">Pantau keuangan usahamu dengan mudah dan cepat</p>
      </div>
      <div class="flex gap-3">
        <button onclick="loadPage('tambah')" class="rounded-2xl bg-white/20 backdrop-blur-sm px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-white/30 active:scale-[0.98]">
          ➕ Tambah Transaksi
        </button>
        <button onclick="loadPage('laporan')" class="rounded-2xl bg-white/20 backdrop-blur-sm px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-white/30 active:scale-[0.98]">
          📑 Laporan
        </button>
      </div>
    </div>
  </div>

  <div id="dashboard-summary"></div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
    <div class="rounded-3xl border border-slate-200 bg-white p-5 md:p-6 shadow-sm">
      <h3 class="text-lg font-semibold text-slate-900 mb-6">Grafik Cashflow</h3>
      <div class="flex items-end justify-between gap-2" id="chart-bars"></div>
      <div class="flex gap-4 mt-4">
        <div class="flex items-center gap-2"><div class="w-3 h-3 rounded bg-blue-500"></div><span class="text-xs text-slate-500">Pemasukan</span></div>
        <div class="flex items-center gap-2"><div class="w-3 h-3 rounded bg-rose-400"></div><span class="text-xs text-slate-500">Pengeluaran</span></div>
      </div>
    </div>

    <div class="rounded-3xl border border-slate-200 bg-white p-5 md:p-6 shadow-sm">
      <h3 class="text-lg font-semibold text-slate-900 mb-4">Transaksi Terbaru</h3>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
            <tr>
              <th class="px-4 py-3 text-left">Tanggal</th>
              <th class="px-4 py-3 text-left">Deskripsi</th>
              <th class="px-4 py-3 text-left">Jenis</th>
              <th class="px-4 py-3 text-left">Nominal</th>
            </tr>
          </thead>
          <tbody id="dashboard-recent"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <button onclick="loadPage('tambah')" class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm flex items-center gap-4 transition hover:shadow-md active:scale-[0.98]">
      <div class="h-12 w-12 rounded-2xl bg-blue-50 flex items-center justify-center text-xl">➕</div>
      <div class="text-left">
        <p class="font-semibold text-slate-900">Tambah Transaksi</p>
        <p class="text-xs text-slate-400">Catat pemasukan atau pengeluaran baru</p>
      </div>
    </button>
    <button onclick="loadPage('laporan')" class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm flex items-center gap-4 transition hover:shadow-md active:scale-[0.98]">
      <div class="h-12 w-12 rounded-2xl bg-emerald-50 flex items-center justify-center text-xl">📊</div>
      <div class="text-left">
        <p class="font-semibold text-slate-900">Lihat Laporan</p>
        <p class="text-xs text-slate-400">Analisis cashflow periode tertentu</p>
      </div>
    </button>
  </div>
</section>
