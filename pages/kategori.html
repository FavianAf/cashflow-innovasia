<section class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h2 class="text-2xl md:text-3xl font-bold text-slate-950">Kategori</h2>
      <p class="text-sm text-slate-500 mt-1">Kelola kategori pemasukan dan pengeluaran</p>
    </div>
    <button class="btn-add-kategori rounded-2xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-[0.98]">
      ➕ Tambah Kategori
    </button>
  </div>

  <div>
    <div class="flex items-center gap-3 mb-4">
      <h3 class="text-lg font-semibold text-slate-900">Kategori Pemasukan</h3>
      <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700" id="kategori-income-count">0</span>
    </div>
    <div id="kategori-income-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8"></div>
  </div>

  <div>
    <div class="flex items-center gap-3 mb-4">
      <h3 class="text-lg font-semibold text-slate-900">Kategori Pengeluaran</h3>
      <span class="rounded-full bg-rose-50 px-3 py-1 text-xs font-semibold text-rose-700" id="kategori-expense-count">0</span>
    </div>
    <div id="kategori-expense-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <div class="text-center pt-4">
    <button class="btn-add-kategori rounded-2xl border border-dashed border-slate-300 bg-slate-50 px-6 py-3 text-sm font-semibold text-slate-500 transition hover:bg-slate-100 active:scale-[0.98]">
      ➕ Tambah Kategori Baru
    </button>
  </div>
</section>
